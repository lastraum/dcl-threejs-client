name: Sync community claims

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  pull_request:
    types: [opened, edited, closed, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'lastraum/dcl-threejs-client'
    runs-on: ubuntu-latest
    steps:
      # Always update CLAIMS on the integration branch. PR heads (esp. forks) may not
      # exist on this repo after merge/close — committing there fails with
      # "fatal: invalid reference: <pr-branch>".
      - uses: actions/checkout@v5
        with:
          ref: dev-latest

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate CLAIMS.yaml from issues + PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-claims-from-issues.mjs

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: sync CLAIMS.yaml from GitHub issues'
          file_pattern: docs/CLAIMS.yaml
          branch: dev-latest
