# Reference nginx site config for Three.js DCL Client (DigitalOcean / static SPA + API proxies).
# Install: copy to /etc/nginx/sites-available/decentraland.lastslice.co and symlink sites-enabled.
#
# The v0.5.0 explorer calls same-origin /api/places/* in production (see mapConfig.placesApiBase).
# Without these location blocks, nginx serves index.html or forwards the full path → Places API 404.

server {
  listen 80;
  listen [::]:80;
  server_name decentraland.lastslice.co;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name decentraland.lastslice.co;

  # TLS — certbot or your provider
  # ssl_certificate     /etc/letsencrypt/live/decentraland.lastslice.co/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/decentraland.lastslice.co/privkey.pem;

  root /var/www/threejs-dcl-client/dist;
  index index.html;

  # --- API proxies (must be BEFORE SPA fallback) ---

  # Dev panel suggestions (systemd: deploy/suggestion-api.service on :8788)
  location = /api/suggestions {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Place analytics (systemd: npm run analytics:server on :8787)
  location /api/analytics/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Auth API — required on custom domains (auth-api CORS rejects decentraland.social)
  location /api/dcl-auth-api/ {
    proxy_pass https://auth-api.decentraland.org/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host auth-api.decentraland.org;
    proxy_set_header Accept application/json;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # World Storage Service — CORS rejects localhost + custom domains (Allow-Origin: false)
  location /api/storage/ {
    proxy_pass https://storage.decentraland.org/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host storage.decentraland.org;
    proxy_set_header Accept application/json;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/peers {
    proxy_pass https://archipelago-ea-stats.decentraland.org/peers;
    proxy_ssl_server_name on;
    proxy_set_header Host archipelago-ea-stats.decentraland.org;
  }

  location /api/parcels/ {
    proxy_pass https://api.decentraland.org/v2/parcels/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.decentraland.org;
  }

  location = /api/worlds/live-data {
    proxy_pass https://worlds-content-server.decentraland.org/live-data;
    proxy_ssl_server_name on;
    proxy_set_header Host worlds-content-server.decentraland.org;
  }

  # Explorer / PlacesView — strips /api/places → places.decentraland.org/api/*
  location /api/places/ {
    proxy_pass https://places.decentraland.org/api/;
    proxy_ssl_server_name on;
    proxy_set_header Host places.decentraland.org;
  }

  location /api/marketplace/ {
    proxy_pass https://marketplace-api.decentraland.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host marketplace-api.decentraland.org;
  }

  location /api/credits/ {
    proxy_pass https://credits.decentraland.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host credits.decentraland.org;
  }

  # Loot Bag meta-tx — same-origin (CORS broken on transactions.lastslice.co).
  # Without this block, POST /api/meta-tx/* hits SPA → nginx 405 Method Not Allowed.
  location /api/meta-tx/ {
    proxy_pass https://transactions.lastslice.co/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host transactions.lastslice.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept application/json;
    client_max_body_size 1m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Generic scene / third-party HTTP egress (ONE pipe for scene fetch + SignedFetch).
  #   /api/scene-http/https/aura.roustan.xyz/api/aura/leaderboard
  #   → https://aura.roustan.xyz/api/aura/leaderboard
  # App-owned aliases (/api/places, /api/marketplace, …) stay above for main-thread UI.
  # Do not use this for bulk catalyst content (client bypasses content hosts).
  location ~ ^/api/scene-http/(https?)/([^/]+)(/.*)?$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $upstream_scheme $1;
    set $upstream_host $2;
    set $upstream_path $3;
    if ($upstream_path = "") { set $upstream_path /; }
    proxy_pass $upstream_scheme://$upstream_host$upstream_path$is_args$args;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $upstream_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Forward ADR-44 / scene signed headers (if present)
    proxy_pass_request_headers on;
    client_max_body_size 2m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Arweave / remote texture passthrough — /api/texture/https/host/path → https://host/path
  # (binary media; kept separate from scene-http JSON/API pipe)
  location ~ ^/api/texture/(https?)/([^/]+)(/.*)?$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $upstream_scheme $1;
    set $upstream_host $2;
    set $upstream_path $3;
    if ($upstream_path = "") { set $upstream_path /; }
    proxy_pass $upstream_scheme://$upstream_host$upstream_path$is_args$args;
    proxy_ssl_server_name on;
  }

  # --- Static assets ---

  location ~* \.wasm$ {
    types { application/wasm wasm; }
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # App routes that must not collide with static asset directories (e.g. old /lootbag/ pack art).
  # Exact match wins over directory autoindex → avoids nginx 403 on refresh.
  location = /lootbag { try_files /index.html =404; }
  location = /lootbag/ { try_files /index.html =404; }
  location = /gacha { try_files /index.html =404; }
  location = /gacha/ { try_files /index.html =404; }

  # Unmatched /api/* must not fall through to SPA (POST → 405 HTML).
  location /api/ {
    default_type application/json;
    return 404 '{"ok":false,"error":"api_route_not_configured"}';
  }

  # SPA fallback — do NOT use `$uri/` (directory index). If a public folder shares a route
  # name (e.g. /lootbag/), `$uri/` returns 403 when autoindex is off.
  location / {
    try_files $uri /index.html;
  }
}