        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.85);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        padding: 0;
        /* Clip only the avatar image; presence badges live on the chip (sibling). */
        overflow: hidden;
        line-height: 0;
        box-sizing: border-box;
      }
      .chat-panel__rail-chip .chat-panel__rail-btn {
        margin: 0;
      }
      /* DM presence: dim offline faces; online keeps full color + green dot. */
      .chat-panel__rail-chip.is-offline .chat-panel__rail-btn {
        opacity: 0.48;
        filter: grayscale(0.55) brightness(0.85);
      }
      .chat-panel__rail-chip.is-online .chat-panel__rail-btn {
        opacity: 1;
        filter: none;
      }
      /*
       * Presence markers sit on the CHIP (outside the overflow:hidden button)
       * so they overlay the top of the profile circle, not clipped inside it.
       */
      .chat-panel__rail-chip {
        overflow: visible;
      }
      .chat-panel__rail-online-dot {
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #3ddc84;
        box-shadow: 0 0 0 2px rgba(12, 8, 20, 0.95);
        pointer-events: none;
        z-index: 6;
      }
      /* Unread badge bottom-right (same corner as online dot); covers the dot when both. */
      .chat-panel__rail-chip > .social-chat-dock__unread,
      .chat-panel__rail-chip > .chat-panel__rail-unread {
        position: absolute;
        top: auto;
        right: -5px;
        bottom: -5px;
        left: auto;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 999px;
        background: #ff3b5c;
        color: #fff;
        font-size: 9px;
        font-weight: 800;
        line-height: 16px;
        text-align: center;
        pointer-events: none;
        box-shadow: 0 0 0 2px rgba(12, 8, 20, 0.95);
        z-index: 7;
      }
      /* When unread is present, hide the green dot (badge owns the corner). */
      .chat-panel__rail-chip.has-unread .chat-panel__rail-online-dot {
        display: none;
      }
      .chat-panel__rail-btn.is-active {
        border-color: rgba(255, 255, 255, 0.9);
      }
      .chat-panel__rail-btn.is-active::before {
        content: '';
        position: absolute;
        left: -11px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 22px;
        border-radius: 2px;
        background: #fff;

      /* DCL favicon mark fills the circle; logo already has its own disc. */
      .chat-panel__rail-btn--svg {

      /* ===== Places View (settings overlay) ===== */
      .places-view {
        --pv-surface: rgba(8, 10, 16, 0.72);
        --pv-border: rgba(255, 255, 255, 0.08);
        --pv-accent: #ff2d55;
        --pv-muted: rgba(255, 255, 255, 0.55);
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        padding: 12px 20px 16px;
        gap: 10px;
        background: rgba(0, 0, 0, 0.18);
        color: #fff;
        overflow: hidden;
      }
      .places-view__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--pv-border);
      }
      .places-view__title {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .places-view__header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .places-view__sort {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--pv-border);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.88);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .places-view__btn {
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid var(--pv-border);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: background 0.15s;
      }
      .places-view__btn--ghost {
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.88);
      }
      .places-view__btn--ghost:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .places-view__subtabs {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }
      .places-view__subtab {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid var(--pv-border);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.65);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .places-view__subtab:hover {
        color: rgba(255, 255, 255, 0.88);
      }
      .places-view__subtab.is-active {
        background: rgba(255, 45, 85, 0.2);
        border-color: rgba(255, 45, 85, 0.45);
        color: #fff;
      }
      .places-view__toolbar {
        flex-shrink: 0;
      }
      .places-view__search {
        width: 100%;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--pv-border);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-size: 13px;
        outline: none;
      }
      .places-view__search::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }
      .places-view__search:focus {
        border-color: rgba(255, 45, 85, 0.5);
      }
      .places-view__cat-bar {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        flex-shrink: 0;
        padding-bottom: 4px;
        scrollbar-width: none;
      }
      .places-view__cat-bar::-webkit-scrollbar {
        display: none;
      }
      /* Category color lives on the pill itself (template pill size/shape). */
      .places-view__cat-pill {
        display: inline-flex;
        align-items: center;
        flex-shrink: 0;
        padding: 5px 14px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--cat-color, #9b8cd9) 50%, transparent);
        background: color-mix(in srgb, var(--cat-color, #9b8cd9) 22%, transparent);
        color: rgba(255, 255, 255, 0.85);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .places-view__cat-pill:hover {
        background: color-mix(in srgb, var(--cat-color, #9b8cd9) 38%, transparent);
        color: #fff;
      }
      .places-view__cat-pill.is-active {
        background: var(--cat-color, #9b8cd9);
        border-color: var(--cat-color, #9b8cd9);
        color: #14092a;
      }
      .places-view__status {
        margin: 0;
        font-size: 12px;
        flex-shrink: 0;
      }
      .places-view__status--loading {
        color: var(--pv-muted);
      }
      .places-view__status--error {
        color: #ffb4b4;
      }
      .places-view__results {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        position: relative;
      }
      .places-view--explorer.places-view {
        height: auto;
        min-height: auto;
        overflow: visible;
        max-width: 1440px;
        margin: 0 auto;
        padding: 8px 0 0;
        background: transparent;
      }
      .places-view__grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      @media (min-width: 900px) {
        .places-view__grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 16px;
        }
      }
      @media (min-width: 1200px) {
        .places-view__grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      .places-view__card {
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        overflow: hidden;
        background: var(--pv-surface);
        border: 1px solid var(--pv-border);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        cursor: default;
      }
      .places-view__card:hover {
        border-color: rgba(255, 255, 255, 0.22);
        box-shadow:
          0 14px 36px rgba(0, 0, 0, 0.38),
          0 0 0 1px rgba(255, 45, 85, 0.28);
        transform: translateY(-2px);
      }
      .places-view__card-media {

      }
      .places-view__card-img {
        width: 100%;
        height: 100%;

        display: block;
      }
      .places-view__card-placeholder {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      }
      .places-view__card-badges {
        position: absolute;
        top: 8px;
        left: 8px;
        display: flex;
        flex-wrap: wrap;

      }
      .places-view__badge {
        padding: 3px 8px;

        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .places-view__badge--featured {
        background: rgba(255, 193, 7, 0.92);
        color: #1a1200;
      }
      .places-view__badge--live {
        background: rgba(255, 45, 85, 0.92);
        color: #fff;
      }
      .places-view__card-count {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 4px 8px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.65);
        font-size: 10px;
        font-weight: 700;
      }
      .places-view__card-body {
        padding: 12px 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .places-view__card-title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .places-view__card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--pv-muted);
        min-height: 22px;
      }
      .places-view__card-creator {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .places-view__card-avatar {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-size: 8px;
        font-weight: 700;
      }
      .places-view__card-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .places-view__card-owner {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .places-view__card-stat {

      }
      .places-view__card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;

      .places-view__card-footer-right {

        padding: 3px 9px;
        border-radius: 999px;
        font-size: 8px;

        letter-spacing: 0.05em;

        background: color-mix(in srgb, var(--cat-color, #9b8cd9) 26%, transparent);

      .places-view__card-cat--more {

        font-weight: 800;

        cursor: pointer;
        transition: filter 0.15s;
      }
      .places-view__jump:hover {
        filter: brightness(1.08);
      }
      .places-view__empty,
      .places-view__load-more {
        margin: 12px 0 0;
        text-align: center;
        font-size: 12px;
        color: var(--pv-muted);
      }
      .places-view__sentinel {
        height: 1px;

      /* Emote wheel — Explorer-style radial menu (gradient wedges + hover pop) */
      .emote-wheel-overlay {
        position: fixed;
        inset: 0;
        z-index: var(--z-client-overlay);
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at center, rgba(20, 12, 36, 0.55) 0%, rgba(0, 0, 0, 0.72) 70%);
        cursor: default;
        opacity: 0;
        pointer-events: auto;
        transition: opacity 0.18s ease;
      }
      .emote-wheel-overlay[hidden] {
        display: none !important;
      }
      .emote-wheel-overlay.is-open {
        opacity: 1;
      }
      .emote-wheel__svg {
        width: min(480px, 90vmin);
        height: min(480px, 90vmin);
        filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.6));
        transform: scale(0.86);
        transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
        pointer-events: none;
        overflow: visible;
      }
      .emote-wheel-overlay.is-open .emote-wheel__svg {
        transform: scale(1);
      }
      .emote-wheel__glow {
        fill: none;
        stroke: rgba(180, 140, 255, 0.22);
        stroke-width: 10;
        opacity: 0.55;
      }
      .emote-wheel__disc {
        fill: rgba(18, 16, 28, 0.45);
        stroke: rgba(255, 255, 255, 0.06);
        stroke-width: 1;
      }
      .emote-wheel__slot {
        pointer-events: auto;
        cursor: pointer;
        transform-box: view-box;
        transform-origin: 220px 220px;
        transition: transform 0.16s cubic-bezier(0.34, 1.55, 0.64, 1);
      }
      .emote-wheel__slot.is-hovered {
        transform: scale(1.09);
      }
      .emote-wheel__wedge {
        stroke: rgba(255, 255, 255, 0.28);
        stroke-width: 1.1;
        transition: stroke 0.14s ease, stroke-width 0.14s ease, filter 0.14s ease;
      }
      .emote-wheel__wedge.is-hovered,
      .emote-wheel__slot.is-hovered .emote-wheel__wedge {
        stroke: rgba(255, 255, 255, 0.72);
        stroke-width: 1.6;
        filter: brightness(1.08) drop-shadow(0 0 10px rgba(255, 120, 180, 0.35));
      }
      .emote-wheel__thumb {
        opacity: 0.96;
        pointer-events: none;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));
        transition: opacity 0.12s ease, filter 0.12s ease;
      }
      .emote-wheel__slot.is-hovered .emote-wheel__thumb {
        opacity: 1;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
      }
      .emote-wheel__key {
        fill: rgba(20, 16, 28, 0.55);
        font-family: system-ui, sans-serif;
        font-size: 11px;
        font-weight: 800;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
        transition: fill 0.12s ease, font-size 0.12s ease;
      }
      .emote-wheel__slot.is-hovered .emote-wheel__key {
        fill: rgba(20, 16, 28, 0.85);
      }
      .emote-wheel__name {
        fill: rgba(18, 14, 28, 0.88);
        font-family: system-ui, sans-serif;
        font-size: 10px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
        paint-order: stroke fill;
        stroke: rgba(255, 255, 255, 0.4);
        stroke-width: 0.5px;
        transition: fill 0.12s ease, font-size 0.12s ease;
      }
      .emote-wheel__slot.is-hovered .emote-wheel__name {
        fill: rgba(12, 8, 20, 0.95);
        font-size: 11px;
      }
      .emote-wheel__center {
        cursor: pointer;
      }
      .emote-wheel__center:hover {
        filter: brightness(1.12);
      }
      .emote-wheel__center {
        fill: url(#emote-center-grad);
        stroke: none;
      }
      .emote-wheel__center-ring {
        fill: none;
        stroke: rgba(255, 255, 255, 0.16);
        stroke-width: 1.5;
        pointer-events: none;
      }
      .emote-wheel__center-title {
        fill: rgba(255, 255, 255, 0.95);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .emote-wheel__center-sub {
        fill: rgba(255, 255, 255, 0.48);
        font-family: system-ui, sans-serif;
        font-size: 10px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .emote-wheel__hint {
        position: absolute;
        left: 50%;
        bottom: max(24px, 5vh);
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.62);
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
        backdrop-filter: blur(8px);
      }
      .emote-wheel__hint kbd {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.88);
        font-family: system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
      }

      /* ===== Scene landing (companion scene-watch) ===== */
      .events-page-view__main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 clamp(16px, 3vw, 40px) 32px;
        box-sizing: border-box;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .events-page-view__main::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      .events-page-view__main .events-view {
        height: auto;
        min-height: auto;
        overflow: visible;
        background: transparent;
      }
      .events-page-view__main .events-view__list-shell {
        overflow: visible;
      }
      .events-page-view__main .events-view--weekly {
        height: auto;
        min-height: 640px;
        grid-template-rows: auto auto minmax(480px, auto);
      }
      .events-page-view__main .events-view--weekly .events-view__columns {
        max-height: none;
        flex: unset;
      }
      .events-page-view__main .events-view--weekly .events-view__highlight {
        height: auto;
        max-height: none;
        overflow: visible;
      }
      .events-page-view__main .events-view--weekly .events-view__col-list {
        overflow-y: visible;
        max-height: none;
      }
      .events-page-view__main .events-view--calendar {
        height: auto;
        min-height: 640px;
        overflow: visible;
      }
      .events-page-view__main .events-view--calendar .events-view__list-shell,
      .events-page-view__main .events-view--calendar .events-view__main {
        overflow: visible;
      }
      body.events-route,
      body.events-route #app {
        overflow: hidden;
      }

      /* ===== 2D Loot Bag (/lootbag) — vertical reel machine ===== */
      body.lootbag-route,
      body.lootbag-route #app {
        overflow: hidden;
      }
      /* Match scene landing content width + horizontal padding */
      .lootbag-page-view__main {
        --lootbag-page-main-max: min(92vw, 1420px);
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: clamp(12px, 3dvh, 32px) clamp(10px, 2vw, 28px) 40px;
        box-sizing: border-box;
        scrollbar-width: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lootbag-page-view__main::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      .lootbag {
        /* Same track width as scene-watch-dest main */
        --lootbag-body-h: 580px;
        --lootbag-vitrine-h: 300px;
        --lootbag-col-gap: clamp(20px, 2.8vw, 40px);
        position: relative;
        width: 100%;
        max-width: var(--lootbag-page-main-max, min(92vw, 1420px));
        margin: 0 auto;
        flex-shrink: 0;
        font-family: inherit;
        color: #fff;
      }

      .lootbag__stage {
        position: relative;
        z-index: 1;
      }
      /*
       * Layout shell only — NO single outer card.
       * Bag shelf + lootpack are independent cards on the page.
       */
      .lootbag__machine,
      .lootbag__machine--vitrine {
        border-radius: 0;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
        backdrop-filter: none;
      }
      .lootbag__play,
      .lootbag__deposit-view {
        box-sizing: border-box;
        height: var(--lootbag-body-h);
        min-height: var(--lootbag-body-h);
        max-height: var(--lootbag-body-h);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .lootbag__play[hidden],
      .lootbag__deposit-view[hidden] {
        display: none !important;
      }
      /*
       * Deposit reuses play columns shell (lootbag__columns + col cards).
       * Only content differs: 2/3 inventory · 1/3 selected.
       */
      .lootbag__deposit-view {
        border-radius: 0;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
        backdrop-filter: none;
      }
      .lootbag__deposit-view .lootbag__columns {
        height: 100%;
      }
      .lootbag__deposit-view .lootbag-dep__list--fill {
        flex: 1 1 auto;
        min-height: 0;
      }
      .lootbag__deposit-view .lootbag-dep__tabs {
        flex-shrink: 0;
        margin: 0;
      }
      .lootbag__deposit-view .lootbag-dep__steps {
        grid-column: 1 / -1;
      }
      .lootbag__deposit-view .lootbag-dep__back {
        flex: 0 0 auto;
        width: auto;
        min-width: 0;
        min-height: 36px;
        height: 36px;
        padding: 0 14px;
      }
      .lootbag__hud--deposit {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 10px;
      }
      .lootbag__hud--deposit .lootbag__hud-left {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-self: start;
        min-width: 0;
      }
      .lootbag__hud--deposit .lootbag__hud-center {
        justify-self: center;
        text-align: center;
      }
      .lootbag__hud--deposit .lootbag__hud-right {
        justify-self: end;
        min-width: 0;
        display: flex;
        justify-content: flex-end;
      }
      .lootbag__hud--deposit .lootbag__title {
        font-size: clamp(16px, 2vw, 22px);
      }
      .lootbag__hud--deposit .lootbag-dep__stat {
        font-size: 14px;
        font-weight: 800;
      }
      /* Wallet / Creator tabs on header row — compact, not full-width */
      .lootbag-dep__tabs--header {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0;
        width: auto;
        max-width: 100%;
      }
      .lootbag-dep__tabs--header .lootbag-dep__tab {
        flex: 0 0 auto;
        padding: 8px 12px;
        white-space: nowrap;
        font-size: 11px;
      }
      /*
       * Deposit inventory track + pick cards:
       * Reuse exact Loot Bag shelf card chrome (lootbag-vitrine__*).
       */
      .lootbag__col .lootbag-dep__track,
      .lootbag__deposit-view .lootbag-dep__track {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        height: auto;
        padding: 4px 2px 8px;
        /* Full scrollable grid — hide scrollbar, keep wheel/touch scroll */
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .lootbag__col .lootbag-dep__track::-webkit-scrollbar,
      .lootbag__deposit-view .lootbag-dep__track::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      /* Deposit picks: same fixed geometry as bag shelf cards */
      button.lootbag-vitrine__card.lootbag-dep__pick {
        appearance: none;
        -webkit-appearance: none;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        width: 100%;
        min-width: 0;
        min-height: var(--lootbag-card-min-h, 196px);
        height: var(--lootbag-card-min-h, 196px);
        max-height: var(--lootbag-card-min-h, 196px);
        margin: 0;
        padding: 0;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(18, 12, 32, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
        color: #fff;
        font: inherit;
        text-align: left;
        cursor: pointer;
        box-sizing: border-box;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }
      button.lootbag-vitrine__card.lootbag-dep__pick.is-pack {
        border-color: rgba(196, 181, 253, 0.35);
      }
      button.lootbag-vitrine__card.lootbag-dep__pick:hover:not(:disabled) {
        transform: translateY(-2px);
        border-color: rgba(196, 181, 253, 0.45);
      }
      button.lootbag-vitrine__card.lootbag-dep__pick:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button.lootbag-vitrine__card.lootbag-dep__pick.is-selected {
        border-color: rgba(255, 45, 85, 0.7);
        box-shadow:
          0 0 0 2px rgba(255, 45, 85, 0.28),
          0 10px 24px rgba(255, 45, 85, 0.2);
        transform: translateY(-2px);
      }
      button.lootbag-vitrine__card.lootbag-dep__pick .lootbag-vitrine__card-art {
        flex: 0 0 var(--lootbag-card-art-h, 110px);
        height: var(--lootbag-card-art-h, 110px);
        min-height: var(--lootbag-card-art-h, 110px);
        max-height: var(--lootbag-card-art-h, 110px);
      }
      button.lootbag-vitrine__card.lootbag-dep__pick .lootbag-vitrine__card-body {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 2px;
        padding: 10px 10px 12px;
        flex: 1 1 auto;
        min-height: 0;
        background: rgba(12, 8, 24, 0.98);
        text-align: left;
      }
      .lootbag-vitrine__card--empty {
        min-height: var(--lootbag-card-min-h, 196px);
        height: var(--lootbag-card-min-h, 196px);
        border: 1px dashed rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.02);
        box-shadow: none;
        pointer-events: none;
      }
      .lootbag-vitrine__track {
        align-items: stretch;
      }
      @media (max-width: 720px) {
        .lootbag__hud--deposit {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .lootbag__hud--deposit .lootbag__hud-center,
        .lootbag__hud--deposit .lootbag__hud-right {
          justify-self: start;
        }
      }

      .lootbag__header {
        margin-bottom: 14px;
        text-align: left;
        padding: 0 2px;
      }
      /* Title lives inside left card HUD (next to In bag) */
      .lootbag__title {
        margin: 0;
        flex: 0 0 auto;
        font-size: clamp(18px, 2.2vw, 24px);
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #fff;
        text-transform: none;
        background: none;
        -webkit-background-clip: unset;
        background-clip: unset;
        animation: none;
        line-height: 1.15;
        white-space: nowrap;
      }
      .lootbag__tagline {
        margin: 6px 0 0;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: none;
        color: rgba(255, 255, 255, 0.5);
      }

      /* ── Play: 2 columns (2/3 bag | 1/3 lootpack). Each column is its own bg card. ── */
      .lootbag__columns {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: var(--lootbag-col-gap);
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
        align-items: stretch;
      }
      .lootbag__col {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        border-radius: 22px;
        background: linear-gradient(
          165deg,
          rgba(55, 28, 90, 0.78) 0%,
          rgba(28, 16, 48, 0.88) 50%,
          rgba(18, 12, 32, 0.92) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow:
          0 0 0 1px rgba(168, 85, 247, 0.1) inset,
          0 16px 40px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
        box-sizing: border-box;
      }
      .lootbag__col--pack {
        gap: 14px;
      }
      /* Pack cost — flat text, no pill / container bg */
      .lootbag__pack-cost {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 4px 0 2px;
        background: transparent;
        border: 0;
        box-shadow: none;
      }
      .lootbag__pack-cost-label {
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }
      .lootbag__pack-cost-row {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        gap: 0 8px;
      }
      .lootbag__pack-cost-value {
        font-size: 20px;
        font-weight: 800;
        color: #fde68a;
        line-height: 1.15;
      }
      .lootbag__pack-cost-bal {
        font-size: 13px;
        font-weight: 650;
        color: rgba(233, 213, 255, 0.72);
        line-height: 1.15;
      }
      .lootbag__pack-cost-bal:empty {
        display: none;
      }
      .lootbag__col-actions {
        flex-shrink: 0;
        display: flex;
        gap: 10px;
        margin-top: auto;
      }
      .lootbag__col-actions .lootbag__btn {
        width: 100%;
      }
      .lootbag__col-actions .lootbag__btn--claim {
        flex: 1;
        width: 100%;
      }

      .lootbag__hud {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 0;
        flex-shrink: 0;
      }
      .lootbag__hud-stats {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 12px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .lootbag__hud-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 8px;
        flex: 0 0 auto;
        margin-left: auto;
      }
      /* Rewards — solid CTA; amount only in centered modal */
      .lootbag__btn--rewards {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        min-width: 108px;
        padding: 10px 18px;
        border-radius: 12px;
        border: 1px solid rgba(52, 211, 153, 0.55);
        background: linear-gradient(145deg, rgba(52, 211, 153, 0.95), rgba(16, 185, 129, 0.92));
        box-shadow: 0 8px 20px rgba(6, 95, 70, 0.4);
        color: #042f2e;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-align: center;
        cursor: pointer;
        backdrop-filter: none;
      }
      .lootbag__btn--rewards:hover:not(:disabled) {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }
      .lootbag__btn--rewards:disabled {
        opacity: 0.5;
        cursor: default;
        transform: none;
      }
      .lootbag__btn--rewards.has-balance {
        box-shadow:
          0 0 0 1px rgba(167, 243, 208, 0.35) inset,
          0 8px 22px rgba(6, 95, 70, 0.5);
      }
      /* Small Add Loot — same control height as refresh, full pill chrome */
      .lootbag__btn.lootbag__btn--add-loot {
        box-sizing: border-box;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: auto;
        min-width: 0;
        height: 36px;
        min-height: 36px;
        max-height: 36px;
        padding: 0 14px;
        margin: 0;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        color: #fff;
        font: inherit;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.02em;
        line-height: 1;
        white-space: nowrap;
        overflow: visible;
      }
      .lootbag__btn.lootbag__btn--add-loot:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.32);
        filter: none;
        transform: none;
      }
      .lootbag__btn.lootbag__btn--add-loot:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .lootbag__chip {
        flex: 1 1 88px;
        min-width: 0;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(22, 12, 42, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      /* Count · refresh · Add Loot — same row, no container bg */
      .lootbag__in-bag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
        min-width: 0;
        padding: 0;
        background: transparent;
        border: 0;
        box-shadow: none;
      }
      .lootbag__in-bag-count {
        font-size: 14px;
        font-weight: 750;
        color: rgba(255, 255, 255, 0.88);
        white-space: nowrap;
        line-height: 1;
      }
      .lootbag__chip-refresh {
        box-sizing: border-box;
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        min-width: 36px;
        min-height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        padding: 0;
      }
      .lootbag__chip-refresh:hover:not(:disabled) {
        color: #fff;
        background: rgba(255, 255, 255, 0.16);
      }
      .lootbag__chip-refresh:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .lootbag__chip-sub {
        font-weight: 650;
        letter-spacing: 0.02em;
        text-transform: none;
        color: rgba(233, 213, 255, 0.72);
        margin-left: 4px;
      }
      .lootbag__chip-sub:empty {
        display: none;
      }
      .lootbag__chip--gold {
        border-color: rgba(196, 181, 253, 0.35);
        background: rgba(139, 92, 246, 0.12);
      }
      .lootbag__chip--claimable {
        flex: 1 1 88px;
        min-width: 0;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid rgba(110, 231, 183, 0.35);
        background: rgba(12, 40, 34, 0.78);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        cursor: pointer;
        color: inherit;
        font: inherit;
        transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
      }
      .lootbag__chip--claimable:hover {
        border-color: rgba(110, 231, 183, 0.55);
        background: rgba(16, 185, 129, 0.16);
        transform: translateY(-1px);
      }
      .lootbag__chip--claimable.has-balance {
        border-color: rgba(52, 211, 153, 0.55);
        box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.12) inset;
      }
      .lootbag__chip--claimable .lootbag__chip-value {
        color: #a7f3d0;
      }
      .lootbag__chip--dim {
        flex: 1.2 1 140px;
      }
      .lootbag__chip-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }
      .lootbag__chip-value {
        font-size: 15px;
        font-weight: 800;
        color: #fff;
      }
      .lootbag__chip--gold .lootbag__chip-value {
        color: #e9d5ff;
      }

      /* Claimable grab fees modal */
      .lootbag-fees-modal {
        position: fixed;
        inset: 0;
        z-index: calc(var(--z-top-modal, 10000) + 15);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
      }
      .lootbag-fees-modal[hidden] {
        display: none !important;
      }
      .lootbag-fees-modal__backdrop {
        position: absolute;
        inset: 0;
        background: rgba(8, 4, 20, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .lootbag-fees-modal__card {
        position: relative;
        z-index: 1;
        width: min(420px, 100%);
        padding: 22px 24px 20px;
        border-radius: 18px;
        background: linear-gradient(160deg, rgba(55, 30, 95, 0.98), rgba(28, 16, 52, 0.98));
        border: 1px solid rgba(110, 231, 183, 0.35);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
        color: #fff;
      }
      .lootbag-fees-modal__x {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .lootbag-fees-modal__x:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .lootbag-fees-modal__kicker {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(167, 243, 208, 0.9);
        margin-bottom: 6px;
      }
      .lootbag-fees-modal__title {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.2;
      }
      .lootbag-fees-modal__amount {
        margin: 0 0 14px;
        font-size: 22px;
        font-weight: 800;
        color: #a7f3d0;
      }
      .lootbag-fees-modal__body {
        display: flex;
        flex-direction: column;
        gap: 10px;

      .lootbag-pack-stage__prize {

      .lootbag-pack-stage__prize[hidden] {

      .lootbag-pack-stage__prize-art {

      .lootbag-pack-stage__prize-art.lootbag-rarity-bg--rare {

      .lootbag__btn--keep {

      .lootbag__vitrine-glass {

      .lootbag__shelf {

      .lootbag-rarity-bg--exotic {
        background: linear-gradient(160deg, #fca5a5 0%, #ef4444 45%, #7f1d1d 100%) !important;
      }
      .lootbag-rarity--common { border-color: rgba(156, 163, 175, 0.4); }
      .lootbag-rarity--uncommon { border-color: rgba(234, 88, 12, 0.55); }
      .lootbag-rarity--rare { border-color: rgba(59, 130, 246, 0.5); }
      .lootbag-rarity--epic { border-color: rgba(168, 85, 247, 0.5); }
      .lootbag-rarity--legendary { border-color: rgba(234, 179, 8, 0.55); }
      .lootbag-rarity--mythic { border-color: rgba(236, 72, 153, 0.5); }
      .lootbag-rarity--unique,
      .lootbag-rarity--exotic { border-color: rgba(239, 68, 68, 0.5); }
      .lootbag-vitrine__card-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 10px 12px;
        flex: 1 1 auto;

      .lootbag-vitrine__card-line--rarity.is-epic { color: #d8b4fe; }

      .lootbag-panel__card-line--title {

      .lootbag-panel__card-line--rarity {

      .lootbag-panel__card-line--rarity.is-uncommon { color: #fdba74; }
      .lootbag-panel__card-line--rarity.is-rare { color: #93c5fd; }
